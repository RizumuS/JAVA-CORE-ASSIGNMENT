
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Feedback Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #2c5d8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2c5d8a;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #19436b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Feedback Form</h2>

        <form action="submitFeedback" method="post">

            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Feedback Type:</label>

            <select name="feedbackType" required>
                <option value="">Select Feedback Type</option>
                <option value="Complaint">Complaint</option>
                <option value="Suggestion">Suggestion</option>
                <option value="Compliment">Compliment</option>
            </select>

            <label>Comments:</label>

            <textarea name="comments"
                      placeholder="Enter your feedback..."
                      required></textarea>

            <button type="submit">Submit Feedback</button>

        </form>

    </div>

</body>
</html>
